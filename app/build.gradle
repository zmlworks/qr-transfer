plugins { id 'com.android.application' }

// Release signing: the keystore lives OUTSIDE the repo.
// Path of a properties file (storeFile/storePassword/keyAlias/keyPassword):
//   env ZML_KEYSTORE_PROPS, or /workspace/android/keys/keystore.properties
def ksFile = file(System.getenv('ZML_KEYSTORE_PROPS') ?: '/workspace/android/keys/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.zmlworks.qrtransfer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.zmlworks.qrtransfer'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }
    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            // + x86_64 so the debug APK also runs on an emulator
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        }
        release {
            // zxing-cpp native library: phones only (64- and 32-bit ARM); other ABIs fall back to Java ZXing
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks['storeFile']) signingConfig signingConfigs.release
        }
    }
    // the offline web sender (web/sender.html) is also bundled so the phone can share it to a PC
    sourceSets { main { assets.srcDirs += ['../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig false }
    lint {
        abortOnError true
        disable 'GradleDependency', 'NewerVersionAvailable', 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
    dependenciesInfo { includeInApk false; includeInBundle false }
    // compress the zxing-cpp .so files in the APK (smaller download; extracted at install)
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'          // QR rendering (QrRender) + the Java fallback decoder
    // zxing-cpp (Apache-2.0): QR decoding. Only BarcodeReader.read(Bitmap) is used, so CameraX is left out.
    implementation('io.github.zxing-cpp:android:3.1.1') { exclude group: 'androidx.camera' }
    testImplementation 'junit:junit:4.13.2'
}
